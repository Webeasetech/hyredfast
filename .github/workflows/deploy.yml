name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # Run the same lint/build/test gate as PRs before any deploy.
  # Deploy is skipped if these fail (covers direct pushes to main too).
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # No VPS provisioned yet — flip the DEPLOY_ENABLED repo variable to "true"
    # once real SSH_HOST/SSH_USER/SSH_PASSWORD secrets are set.
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            # Clone repo on first deploy, pull on subsequent ones
            if [ ! -d /app ]; then
              git clone https://github.com/Webeasetech/hyredfast.git /app
            fi

            cd /app
            git pull origin main

            # Write .env file from secrets
            cat > .env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            API_KEY=${{ secrets.API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CREDENTIAL_ENC_KEY=${{ secrets.CREDENTIAL_ENC_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SUPPORT_NOTIFY_EMAILS=${{ secrets.SUPPORT_NOTIFY_EMAILS }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}
            LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING }}
            LETSENCRYPT_EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
            APP_DOMAIN=${{ secrets.APP_DOMAIN }}
            APP_URL=${{ secrets.APP_URL }}
            TRACKING_BASE_URL=${{ secrets.TRACKING_BASE_URL }}
            REDIS_PORT=6379
            EOF

            # Write frontend .env.production needed at build time
            cat > apps/hyredfast-frontend/.env.production <<EOF
            API_KEY=${{ secrets.API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TRIGGER_SECRET_KEY=${{ secrets.TRIGGER_SECRET_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            EOF

            # Write agents .env.production needed at build time
            cat > apps/agents/.env.production <<EOF
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}
            LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BACKEND_URL=http://frontend:3000
            EOF

            docker compose up -d --build
